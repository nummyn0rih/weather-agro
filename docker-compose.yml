# Base compose — production-ish stack.
# Dev overrides in docker-compose.dev.yml.
# Backend/frontend/telegram_bot use base images with idle commands until
# task 1.1 (BE init) and task 2.1 (FE init) introduce Dockerfiles + real CMDs.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: weather-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weather-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    # TODO(task 1.1): replace `image` with `build: ./backend` and remove `command`.
    image: python:3.11-slim
    container_name: weather-backend
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weather-net
    command: ["tail", "-f", "/dev/null"]

  frontend:
    # TODO(task 2.1): replace `image` with `build: ./frontend` and remove `command`.
    image: node:20-alpine
    container_name: weather-frontend
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ./frontend:/app
    networks:
      - weather-net
    command: ["tail", "-f", "/dev/null"]

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - weather-net

  telegram_bot:
    # TODO(task 4.x): replace `image` with `build: ./backend` and switch command
    # to `python -m app.telegram_bot` once bot module exists.
    image: python:3.11-slim
    container_name: weather-telegram-bot
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weather-net
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
  uploads:

networks:
  weather-net:
    driver: bridge
