# Base compose — production-ish stack.
# Dev overrides in docker-compose.dev.yml.
# Backend/frontend/telegram_bot use base images with idle commands until
# task 1.1 (BE init) and task 2.1 (FE init) introduce Dockerfiles + real CMDs.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: weather-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weather-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: weather-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weather-net

  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: weather-frontend
    restart: unless-stopped
    env_file: .env
    networks:
      - weather-net

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - weather-net

  telegram_bot:
    # Same image as backend; bot entrypoint lands in task 4.x.
    build: ./backend
    container_name: weather-telegram-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weather-net
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
  uploads:

networks:
  weather-net:
    driver: bridge
